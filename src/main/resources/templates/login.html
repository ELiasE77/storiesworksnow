<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{login.pageTitle}">Login | Journally</title>
    <link rel="stylesheet" th:href="@{/css/journally.css}">
</head>
<body class="auth-body" data-theme="sol">
<main class="auth-shell">
    <div class="auth-topbar">
        <div th:replace="~{navbar :: languageSwitcher}"></div>
    </div>

    <section class="auth-card">
        <div class="auth-hero">
            <div class="brand-wordmark" aria-label="Journally">
                <span class="dark">journ</span><span class="accent">ally</span>
            </div>
            <h1 th:text="#{login.heading}">Welcome back</h1>
            <p th:text="#{login.subheading}">A calm place for reflection, images, and personal companion questions.</p>
        </div>

        <form action="/login" method="post" class="auth-form">
            <div>
                <label class="form-label" for="username" th:text="#{auth.username}">Username</label>
                <input type="text" id="username" name="username" th:placeholder="#{login.usernamePlaceholder}" required/>
            </div>

            <div>
                <label class="form-label" for="password" th:text="#{auth.password}">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
            </div>

            <button class="button" type="submit" th:text="#{login.submit}">Log in</button>
        </form>

        <p class="muted-text" style="margin-top: 16px;">
            <span th:text="#{login.noAccount}">No account yet?</span>
            <a th:href="@{/register}" style="color:var(--accent-strong);font-weight:800;" th:text="#{login.registerLink}">Register now</a>
        </p>
    </section>
</main>
</body>
</html>
