<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{questionnaire.pageTitle}">Onboarding | Journally</title>
    <link rel="stylesheet" th:href="@{/css/journally.css}">
</head>
<body class="auth-body" data-theme="sol">
<main class="auth-shell">
    <div class="auth-topbar">
        <div th:replace="~{navbar :: languageSwitcher}"></div>
    </div>

    <section class="questionnaire-card">
        <div class="questionnaire-hero">
            <div class="brand-wordmark" aria-label="Journally">
                <span class="dark">journ</span><span class="accent">ally</span>
            </div>
            <h1 th:text="#{questionnaire.heading}">How would you like to experience Journally?</h1>
            <p th:text="#{questionnaire.subheading}">Tell us a little about yourself so the interface, your companion, and the AI guidance can feel more personal.</p>
        </div>

        <form th:action="@{/profile/questionnaire}" th:object="${profile}" method="post" enctype="multipart/form-data" class="questionnaire-form">
            <div class="form-grid two">
                <div>
                    <label class="form-label" for="name" th:text="#{questionnaire.name}">Name</label>
                    <input type="text" th:field="*{name}" id="name" th:placeholder="#{questionnaire.namePlaceholder}" required>
                </div>
                <div>
                    <label class="form-label" for="age" th:text="#{questionnaire.age}">Age</label>
                    <input type="number" th:field="*{age}" id="age" min="1" max="120" th:placeholder="#{questionnaire.agePlaceholder}" required>
                </div>
                <div>
                    <label class="form-label" for="gender" th:text="#{questionnaire.gender}">Gender</label>
                    <input type="text" th:field="*{gender}" id="gender" th:placeholder="#{questionnaire.genderPlaceholder}" required>
                </div>
                <div>
                    <label class="form-label" for="height" th:text="#{questionnaire.height}">Height</label>
                    <input type="text" th:field="*{height}" id="height" th:placeholder="#{questionnaire.heightPlaceholder}" required>
                </div>
                <div>
                    <label class="form-label" for="nationality" th:text="#{questionnaire.nationality}">Nationality</label>
                    <input type="text" th:field="*{nationality}" id="nationality" th:placeholder="#{questionnaire.nationalityPlaceholder}" required>
                </div>
                <div>
                    <label class="form-label" for="hair" th:text="#{questionnaire.hair}">Hair</label>
                    <input type="text" th:field="*{hair}" id="hair" th:placeholder="#{questionnaire.hairPlaceholder}" required>
                </div>
            </div>

            <div>
                <label class="form-label" th:text="#{questionnaire.companion}">Choose companion</label>
                <div class="companion-grid">
                    <label class="companion-card"
                           th:each="companion : ${companionOptions}"
                           th:style="'--companion-accent:' + ${companion.accent()}">
                        <input type="radio" th:field="*{companionKey}" th:value="${companion.key()}" style="display:none;">
                        <div class="companion-sprite"></div>
                        <div>
                            <span class="micro-label" th:text="#{questionnaire.companionLabel}">Companion</span>
                            <h3 th:text="${@siteText.companionName(companion.key(), #locale)}">Sol</h3>
                            <p th:text="${@siteText.companionDescription(companion.key(), #locale)}">Warm and optimistic.</p>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="form-label" for="hobbies" th:text="#{questionnaire.hobbies}">Hobbies</label>
                <textarea th:field="*{hobbies}" id="hobbies" rows="3" th:placeholder="#{questionnaire.hobbiesPlaceholder}" required></textarea>
            </div>

            <div>
                <label class="form-label" for="persona" th:text="#{questionnaire.persona}">Why do you want to use Journally?</label>
                <textarea th:field="*{persona}" id="persona" rows="4" th:placeholder="#{questionnaire.personaPlaceholder}" required></textarea>
            </div>

            <div>
                <label class="form-label" for="profileImage" th:text="#{questionnaire.profileImage}">Profile image</label>
                <input type="file" id="profileImage" name="profileImage" accept="image/*">
            </div>

            <div class="button-row">
                <button type="submit" class="button" th:text="#{questionnaire.submit}">Save profile</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
