<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Direct Messages</title>
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/social/chat.css}">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>
<div class="chat-layout">
  <aside class="chat-sidebar">
    <h2>Chats</h2>
    <p th:if="${#lists.isEmpty(contacts)}">Follow each other to start a chat.</p>
    <ul>
      <li th:each="contact : ${contacts}">
        <button class="contact-button"
                th:text="${contact.username}"
                th:attr="data-username=${contact.username}"></button>
      </li>
    </ul>
  </aside>

  <section class="chat-main" data-current-user="" th:attr="data-current-user=${currentUser.username}">
    <div class="chat-header" id="chat-header">Select a friend to start chatting</div>
    <div class="chat-history" id="chat-history"></div>
    <form class="chat-form" id="chat-form">
      <textarea id="chat-message" rows="3" placeholder="Type a message..."></textarea>
      <div class="chat-actions">
        <input type="file" id="chat-image" accept="image/*">
        <button type="button" id="clear-image">Clear image</button>
        <button type="submit">Send</button>
      </div>
      <div id="selected-image" class="selected-image"></div>
    </form>
  </section>
</div>

<script th:src="@{/js/social/chat.js}"></script>
</body>
</html>
