<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{register.pageTitle}">Register | Journally</title>
    <link rel="stylesheet" th:href="@{/css/journally.css}">
</head>
<body class="auth-body" data-theme="sol">
<main class="auth-shell">
    <div class="auth-topbar">
        <div th:replace="~{navbar :: languageSwitcher}"></div>
    </div>

    <section class="auth-card">
        <div class="auth-hero">
            <div class="brand-wordmark" aria-label="Journally">
                <span class="dark">journ</span><span class="accent">ally</span>
            </div>
            <h1 th:text="#{register.heading}">Start with Journally</h1>
            <p th:text="#{register.subheading}">Create your account and set up your personal reflection profile in the next step.</p>
        </div>

        <form th:action="@{/register}" th:object="${userDto}" method="post" class="auth-form">
            <div class="error-text" th:if="${registrationError}" th:text="${registrationError}"></div>

            <div>
                <label class="form-label" for="username" th:text="#{auth.username}">Username</label>
                <input type="text" id="username" th:field="*{username}" th:placeholder="#{register.usernamePlaceholder}" required/>
                <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div>
                <label class="form-label" for="password" th:text="#{auth.password}">Password</label>
                <input type="password" id="password" th:field="*{password}" th:placeholder="#{register.passwordPlaceholder}" required/>
                <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button class="button" type="submit" th:text="#{register.submit}">Create account</button>
        </form>

        <p class="muted-text" style="margin-top: 16px;">
            <span th:text="#{register.haveAccount}">Already with us?</span>
            <a th:href="@{/login}" style="color:var(--accent-strong);font-weight:800;" th:text="#{register.loginLink}">Go to login</a>
        </p>
    </section>
</main>
</body>
</html>
