<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{community.create.pageTitle}">Create community</title>
    <link rel="stylesheet" th:href="@{/css/journally.css}">
    <link rel="stylesheet" th:href="@{/css/community/communityCreator.css}">
</head>
<body class="journally-body" th:attr="data-theme=${currentCompanionKey}">
<main class="app-shell">
    <div th:replace="~{navbar :: navbar}"></div>

    <header>
        <h1 th:text="#{community.create.heading}">Create a new community</h1>
    </header>

    <section class="create-community-container">
        <form id="create-community-form" action="/communities/create" method="POST">
            <label for="communityName" th:text="#{community.create.name}">Community name</label>
            <input type="text" id="communityName" name="communityName" th:placeholder="#{community.create.namePlaceholder}" required>

            <label for="description" th:text="#{community.create.description}">Description</label>
            <textarea id="description" name="description" th:placeholder="#{community.create.descriptionPlaceholder}" required></textarea>

            <div class="button-group">
                <button type="submit" th:text="#{community.create.submit}">Create community</button>
                <button type="button" onclick="window.location.href='/communities/user'" th:text="#{common.cancel}">Cancel</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
