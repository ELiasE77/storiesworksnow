<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{community.overview.pageTitle}">Community overview</title>
    <link rel="stylesheet" th:href="@{/css/journally.css}">
    <link rel="stylesheet" th:href="@{/css/community/allCommunities.css}">
</head>
<body class="journally-body" th:attr="data-theme=${currentCompanionKey}">
<main class="app-shell">
    <div th:replace="~{navbar :: navbar}"></div>

    <header>
        <h1 th:text="#{community.overview.heading}">All communities</h1>
    </header>

    <div class="create-community-container">
        <a th:href="@{/communities/createCommunity}" class="create-community-link" th:text="#{community.create.link}">Create community</a>
    </div>

    <section class="community-container">
        <h2 th:text="#{community.overview.listTitle}">List of communities</h2>
        <div class="community-list">
            <ul>
                <li th:each="community : ${communities}" class="community-item">
                    <a th:href="@{'/communities/' + ${community.id}}" class="community-link">
                        <div class="community-details">
                            <h3 th:text="${community.name}"></h3>
                            <p th:text="#{community.members(${community.memberCount})}">Members: 12</p>

                            <form th:action="@{'/communities/join/' + ${community.id}}" method="post">
                                <button type="submit" class="join-button" th:text="#{community.join}">Join</button>
                            </form>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </section>
</main>
</body>
</html>
