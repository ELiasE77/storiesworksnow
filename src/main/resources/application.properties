# ==========================================
# APPLICATION PROPERTIES ? Stories v2 (MariaDB 9.2)
# ==========================================

# App info & static resources
spring.application.name=Journal_site
spring.web.resources.static-locations=classpath:/static/

# ==========================================
# Database Configuration (MariaDB 9.2.0)
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/login
spring.datasource.username=stories_user
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# Hibernate / JPA Settings
# ==========================================
# Automatically update schema to match your entities
spring.jpa.hibernate.ddl-auto=update

# Explicit dialect fixes "Unable to determine Dialect" error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Show SQL in logs for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server Settings
# ==========================================
server.address=0.0.0.0
server.port=8080
